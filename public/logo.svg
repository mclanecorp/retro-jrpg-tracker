<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title>Retro Quest logo</title>
  <desc>Neon pixel portal with a game controller in a dark retro style.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#10152c" />
      <stop offset="100%" stop-color="#060814" />
    </linearGradient>
    <linearGradient id="portal" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#42f5ff" />
      <stop offset="50%" stop-color="#7e6bff" />
      <stop offset="100%" stop-color="#ff4fd8" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="256" height="256" rx="52" fill="url(#bg)" />
  <g filter="url(#glow)">
    <path d="M76 58h104v24H76zm-24 24h24v92H52zm128 0h24v92h-24zm-104 92h104v24H76zm24-56h56v24h-56z" fill="url(#portal)"/>
    <path d="M116 96h24v72h-24z" fill="#0a0f20" opacity=".9"/>
    <path d="M86 122h84c18 0 34 12 40 30l10 30h-28l-8-20c-2-5-7-8-12-8H84c-5 0-10 3-12 8l-8 20H36l10-30c6-18 22-30 40-30Z" fill="#0d1330" stroke="url(#portal)" stroke-width="8"/>
    <rect x="72" y="142" width="32" height="12" rx="3" fill="#42f5ff"/>
    <rect x="82" y="132" width="12" height="32" rx="3" fill="#42f5ff"/>
    <circle cx="156" cy="144" r="8" fill="#ff4fd8"/>
    <circle cx="178" cy="160" r="8" fill="#7e6bff"/>
    <rect x="108" y="168" width="40" height="10" rx="5" fill="#7cefff" opacity=".85"/>
  </g>
</svg>
